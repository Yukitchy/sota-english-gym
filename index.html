<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SOTA'S ENGLISH GYM｜そうたの英語トレセン</title>
<style>
:root{
  --bg:#02070E; --panel:rgba(9,28,44,.78); --panel2:rgba(15,42,64,.88);
  --line:rgba(86,214,240,.30); --line-strong:rgba(86,214,240,.65);
  --cyan:#56D6F0; --cyan-hi:#B4F1FF; --cyan-dim:#2B7E96;
  --green:#3EE6A8; --red:#FF6E5E; --amber:#FFC351;
  --text:#EAF7FF; --sub:#93B4CA;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;min-height:100vh;line-height:1.6}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(ellipse 130% 60% at 50% -12%, rgba(40,125,165,.38), transparent 62%),
    radial-gradient(ellipse 90% 50% at 50% 112%, rgba(18,70,110,.32), transparent 62%),
    repeating-linear-gradient(0deg, rgba(86,214,240,.045) 0 1px, transparent 1px 44px),
    repeating-linear-gradient(90deg, rgba(86,214,240,.045) 0 1px, transparent 1px 44px);}
body::after{content:"";position:fixed;left:0;right:0;top:-22%;height:22%;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(86,214,240,.07),transparent);
  animation:scan 9s linear infinite;}
@keyframes scan{to{transform:translateY(600%)}}
#app{max-width:520px;margin:0 auto;padding:16px 16px 90px;animation:boot .5s ease-out}
@keyframes boot{from{opacity:0;transform:translateY(8px)}}

/* header */
header{display:flex;align-items:center;gap:12px;padding:6px 2px 16px}
.logo{width:44px;height:44px;border-radius:50%;flex-shrink:0;position:relative;
  background:radial-gradient(circle, #E4FCFF 0 16%, rgba(120,226,248,.95) 24%, rgba(24,70,100,.9) 42%, rgba(4,18,32,.96) 62%);
  box-shadow:0 0 16px rgba(86,214,240,.55), inset 0 0 8px rgba(180,241,255,.8);
  animation:reactor 3s ease-in-out infinite;}
.logo::before{content:"";position:absolute;inset:3px;border-radius:50%;
  border:2px dashed rgba(150,232,252,.75);animation:spin 14s linear infinite;}
@keyframes reactor{0%,100%{box-shadow:0 0 10px rgba(86,214,240,.4), inset 0 0 6px rgba(180,241,255,.7)}
  50%{box-shadow:0 0 24px rgba(86,214,240,.85), inset 0 0 11px rgba(180,241,255,.95)}}
@keyframes spin{to{transform:rotate(360deg)}}
header h1{font-size:13.5px;letter-spacing:.1em;white-space:nowrap;color:var(--cyan-hi);text-shadow:0 0 12px rgba(86,214,240,.55);font-weight:700}
header .sub{font-size:11px;color:var(--sub);letter-spacing:.1em}
.streak{margin-left:auto;text-align:right;font-size:11px;color:var(--sub);white-space:nowrap}
.streak b{display:block;font-size:18px;color:var(--amber);text-shadow:0 0 10px rgba(255,195,81,.5);font-variant-numeric:tabular-nums}

/* cards / HUD panels */
.card,.menu-btn{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.card::before,.menu-btn::before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;pointer-events:none;
  border-top:2px solid var(--line-strong);border-left:2px solid var(--line-strong);border-radius:var(--radius) 0 0 0;}
.card::after,.menu-btn::after{content:"";position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;pointer-events:none;
  border-bottom:2px solid var(--line-strong);border-right:2px solid var(--line-strong);border-radius:0 0 var(--radius) 0;}
.card{padding:16px;margin-bottom:12px}
.menu-btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px;margin-bottom:12px;color:var(--text);font-size:15px;text-align:left;cursor:pointer;transition:transform .08s, box-shadow .15s, border-color .15s}
.menu-btn:active{transform:scale(.98);border-color:var(--line-strong);box-shadow:0 0 14px rgba(86,214,240,.25)}
.menu-btn .ic{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.menu-btn .tt b{display:block;font-size:15px}
.menu-btn .tt span{font-size:12px;color:var(--sub)}
.menu-btn .arrow{margin-left:auto;color:var(--cyan-dim)}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:10px;letter-spacing:.06em}
.qhead .quit{background:none;border:none;color:var(--sub);font-size:13px;cursor:pointer;padding:4px}
.bar{height:6px;background:rgba(15,42,64,.9);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan-dim),var(--cyan) 60%,var(--cyan-hi));border-radius:3px;transition:width .3s;box-shadow:0 0 8px rgba(86,214,240,.7)}
.prompt-label{font-size:12px;color:var(--cyan);letter-spacing:.18em;margin-bottom:6px;text-shadow:0 0 8px rgba(86,214,240,.4)}
.prompt{font-size:26px;font-weight:700;margin-bottom:4px;word-break:break-word;text-shadow:0 0 14px rgba(86,214,240,.25)}
.prompt.small{font-size:18px;font-weight:600;line-height:1.7}
.prompt-note{font-size:12px;color:var(--sub);margin-bottom:16px}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.choice{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--cyan-dim);border-radius:8px;padding:14px;font-size:15px;color:var(--text);text-align:left;cursor:pointer;transition:transform .08s;word-break:break-word}
.choice:active{transform:scale(.98)}
.choice.correct{background:rgba(62,230,168,.13);border-color:var(--green);border-left-color:var(--green);box-shadow:0 0 12px rgba(62,230,168,.3)}
.choice.wrong{background:rgba(255,110,94,.13);border-color:var(--red);border-left-color:var(--red);box-shadow:0 0 12px rgba(255,110,94,.3)}
.choice:disabled{cursor:default;opacity:1}
.explain{margin-top:14px;padding:12px 14px;background:rgba(86,214,240,.07);border-left:3px solid var(--cyan);border-radius:0 8px 8px 0;font-size:13px;color:var(--text)}
.explain b{color:var(--cyan)}
.next-btn{width:100%;margin-top:16px;padding:15px;border:1px solid var(--line-strong);border-radius:8px;background:linear-gradient(135deg,#2FB9DE,#1E7FD6);color:#021019;font-size:16px;font-weight:700;letter-spacing:.08em;cursor:pointer;box-shadow:0 0 16px rgba(86,214,240,.35)}
.tag{display:inline-block;font-size:11px;padding:2px 10px;border-radius:99px;background:var(--panel2);color:var(--cyan);border:1px solid var(--line);margin-bottom:10px;letter-spacing:.06em}

/* result */
.result{text-align:center;padding:26px 16px}
.result .big{font-size:52px;filter:drop-shadow(0 0 14px rgba(86,214,240,.5))}
.result h2{font-size:20px;margin:8px 0 2px;letter-spacing:.08em}
.result p{color:var(--sub);font-size:13px}
.score-row{display:flex;justify-content:center;gap:24px;margin:18px 0}
.score-row div b{display:block;font-size:26px;color:var(--cyan-hi);text-shadow:0 0 12px rgba(86,214,240,.5);font-variant-numeric:tabular-nums}
.score-row div span{font-size:11px;color:var(--sub)}
.review-list{text-align:left;margin-top:14px}
.review-list .item{padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:13px}
.review-list .item b{color:var(--cyan)}

/* settings pills */
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.pill{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);color:var(--sub);font-size:13px;cursor:pointer}
.pill.on{background:rgba(86,214,240,.14);border-color:var(--cyan);color:var(--cyan-hi);font-weight:600;box-shadow:0 0 10px rgba(86,214,240,.3)}
.section-label{font-size:12px;color:var(--sub);margin-top:14px;letter-spacing:.08em}

/* stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--cyan-hi);text-shadow:0 0 12px rgba(86,214,240,.5);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--sub)}
.weak-item{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid rgba(86,214,240,.15);font-size:14px}
.weak-item:last-child{border-bottom:none}
.weak-item .ja{color:var(--sub);font-size:12px;text-align:right}
h3.sec{font-size:14px;margin:6px 0 10px;color:var(--cyan);letter-spacing:.14em;text-shadow:0 0 8px rgba(86,214,240,.4)}

/* pron */
.mic-btn{width:88px;height:88px;border-radius:50%;border:none;position:relative;
  background:radial-gradient(circle, #E4FCFF 0 12%, rgba(120,226,248,.95) 20%, rgba(24,70,100,.95) 44%, rgba(4,18,32,.98) 66%);
  box-shadow:0 0 20px rgba(86,214,240,.5);
  font-size:34px;display:block;margin:20px auto 8px;cursor:pointer}
.mic-btn::before{content:"";position:absolute;inset:5px;border-radius:50%;
  border:2px dashed rgba(150,232,252,.65);animation:spin 10s linear infinite}
.mic-btn.listening{animation:pulse 1.2s infinite;background:radial-gradient(circle, #FFE9E4 0 12%, rgba(255,140,120,.95) 20%, rgba(120,40,30,.95) 44%, rgba(30,6,4,.98) 66%)}
.mic-btn.listening::before{border-color:rgba(255,150,130,.7)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,110,94,.45)}70%{box-shadow:0 0 0 24px rgba(255,110,94,0)}100%{box-shadow:0 0 0 0 rgba(255,110,94,0)}}
.mic-hint{text-align:center;font-size:12px;color:var(--sub);min-height:18px}
.pron-target{font-size:24px;font-weight:700;text-align:center;margin:10px 0 2px;word-break:break-word;text-shadow:0 0 14px rgba(86,214,240,.3)}
.pron-ja{text-align:center;color:var(--sub);font-size:13px;margin-bottom:10px}
.listen-btn{display:block;margin:0 auto;background:var(--panel2);border:1px solid var(--line-strong);color:var(--cyan);border-radius:99px;padding:9px 20px;font-size:14px;cursor:pointer}
.heard{margin-top:12px;text-align:center;font-size:17px;line-height:1.9}
.heard .hit{color:var(--green)}
.heard .miss{color:var(--red);text-decoration:underline}
.score-big{text-align:center;font-size:30px;font-weight:800;margin-top:10px;color:var(--cyan-hi);text-shadow:0 0 14px rgba(86,214,240,.5)}
.back-link{background:none;border:none;color:var(--sub);font-size:13px;cursor:pointer;padding:8px 0;display:block}
.note{font-size:12px;color:var(--sub)}
.footer-note{text-align:center;font-size:11px;color:var(--sub);margin-top:20px;opacity:.7;letter-spacing:.06em}

.mic-help{margin:12px auto 0;max-width:340px;font-size:12px;color:var(--sub)}
.mic-help summary{cursor:pointer;color:var(--cyan-dim);letter-spacing:.04em}
.mic-help ol{margin:8px 0 4px 18px;display:flex;flex-direction:column;gap:6px;line-height:1.7}
.mic-help b{color:var(--text)}

/* prep lab */
.prep-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.prep-tile{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 6px 8px;color:var(--cyan-hi);font-size:14px;font-weight:700;letter-spacing:.06em;cursor:pointer;text-align:center}
.prep-tile:active{transform:scale(.96);border-color:var(--line-strong)}
.prep-tile b{display:block;margin-top:2px}
.tile-svg svg{width:100%;height:40px}
.core-svg svg{width:100%;max-width:230px;display:block;margin:6px auto 10px}
svg .pv{stroke:#56D6F0;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .pvd{stroke:#56D6F0;stroke-width:2;fill:none;stroke-dasharray:4 4;stroke-linecap:round}
svg .pb{fill:#FFC351}
svg .pbg{fill:rgba(86,214,240,.10)}
.combo{padding:10px 4px;border-bottom:1px solid rgba(86,214,240,.15);cursor:pointer}
.combo:last-child{border-bottom:none}
.combo b{color:var(--cyan-hi);font-size:15px}
.combo .combo-mean{margin-left:10px;font-size:14px}
.combo .combo-img{display:block;font-size:12px;color:var(--sub);margin-top:2px}

@media (prefers-reduced-motion:reduce){
  body::after,.logo,.logo::before,.mic-btn::before,.mic-btn.listening,#app{animation:none!important}
}
</style>
</head>

const store = {

};
let P = Object.assign({words:{}, drills:{}, preps:{}, days:{}, total:0, correct:0}, store.load());

function today(){ return new Date().toISOString().slice(0,10); }
function bumpDay(){ P.days[today()] = (P.days[today()]||0)+1; }
function streak(){
  let s=0, d=new Date();
  if(!P.days[today()]) d.setDate(d.getDate()-1); // 今日まだでも昨日から継続扱い
  while(P.days[d.toISOString().slice(0,10)]){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function wstat(key){ return P.words[key] || {c:0,w:0}; }
function isWeak(v){ const s=wstat(v.en); return s.w>0 && s.w>=s.c; }
function isMastered(v){ const s=wstat(v.en); return s.c>=3 && s.c>s.w*2; }

const $ = sel => document.querySelector(sel);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

const FILTERS = {
  recent:{label:"最近の授業", fn:v=>v.d>="2026-01-01"},
  all:{label:"全期間", fn:v=>true},
  repeat:{label:"よく出た語", fn:v=>v.n>1},
  weak:{label:"苦手だけ", fn:v=>isWeak(v)}
};
function pickVocab(filterKey, n){
  let pool = VOCAB.filter(FILTERS[filterKey].fn);
  if(pool.length < 4) pool = VOCAB.slice();
  // 苦手語を優先しつつランダム
  const weighted = pool.map(v=>{
    const s=wstat(v.en);
    return {v, w: 1 + s.w*2 - Math.min(s.c,3)*0.3 + (v.n>1?0.5:0)};
  });
  const out=[];
  const bag = weighted.slice();
  while(out.length<n && bag.length){
    let tot = bag.reduce((a,b)=>a+Math.max(b.w,0.1),0);
    let r = Math.random()*tot;
    for(let i=0;i<bag.length;i++){
      r -= Math.max(bag[i].w,0.1);
      if(r<=0){ out.push(bag[i].v); bag.splice(i,1); break; }
    }
  }
  return out;
}
function vocabQuestion(v, dir){
  const others = shuffle(VOCAB.filter(x=>x.en!==v.en)).slice(0,3);
  if(dir==="e2j"){
    return {type:"vocab", key:v.en, prompt:v.en, label:"この単語の意味は？",
      choices:shuffle([{t:v.ja,ok:true},...others.map(o=>({t:o.ja,ok:false}))]),
      answer:v.ja, sub:v};
  }
  return {type:"vocab", key:v.en, prompt:v.ja, label:"英語で言うと？",
    choices:shuffle([{t:v.en,ok:true},...others.map(o=>({t:o.en,ok:false}))]),
    answer:v.en, sub:v};

function question(){
  const q = session.qs[session.i];
  const pct = Math.round(session.i/session.qs.length*100);
  render(`${header()}
  <div class="card">
    <div class="qhead"><span>Q${session.i+1} / ${session.qs.length}</span><button class="quit" onclick="home()">やめる ✕</button></div>

    ${q.type==="drill"?`<div class="prompt-note">↑ 実際の授業から出題。正しいのを選ぼう</div>`:""}
    <div class="choices">
      ${q.choices.map((c,i)=>`<button class="choice" id="ch${i}" onclick="answer(${i})">${esc(c.t)}</button>`).join("")}
    </div>
    <div id="after"></div>
  </div>`);
}
function answer(i){
  const q = session.qs[session.i];
  const c = q.choices[i];
  q.choices.forEach((ch,j)=>{
    const el = $("#ch"+j);
    el.disabled = true;
    if(ch.ok) el.classList.add("correct");
    else if(j===i) el.classList.add("wrong");
  });
  // 記録
  bumpDay(); P.total++;
  if(q.type==="vocab"){
    const s = P.words[q.key] || {c:0,w:0};
    c.ok ? s.c++ : s.w++;
    P.words[q.key]=s;
  } else if(q.type==="prep"){
    const s = P.preps[q.key] || {c:0,w:0};
    c.ok ? s.c++ : s.w++;
    P.preps[q.key]=s;
  } else {
    const s = P.drills[q.key] || {c:0,w:0};
    c.ok ? s.c++ : s.w++;
    P.drills[q.key]=s;
  }
  if(c.ok){ P.correct++; session.ok++; } else { session.misses.push(q); }
  store.save(P);
  const exp = q.explain ? `<div class="explain">${q.explain}</div>` :
    (!c.ok ? `<div class="explain"><b>正解:</b> ${esc(q.answer)}</div>` : "");
  $("#after").innerHTML = `${exp}
    <button class="listen-btn" style="margin-top:14px" onclick="speakCurrent()">🔊 発音を聞く</button>
    <button class="next-btn" onclick="nextQ()">${session.i+1<session.qs.length?"次へ →":"結果を見る"}</button>`;
  $("#after").querySelector(".next-btn").focus();
}
function speakCurrent(){
  const q = session.qs[session.i];
  speak(cleanTarget(q.type==="vocab" ? q.sub.en : q.type==="prep" ? q.speakText : q.answer));
}
function nextQ(){
  session.i++;
  if(session.i < session.qs.length) question(); else result();
}
function result(){
  const rate = Math.round(session.ok/session.qs.length*100);
  const face = rate===100?"🏆":rate>=80?"🎉":rate>=60?"💪":"🔧";
  const msg = rate===100?"パーフェクト！":rate>=80?"ナイスラン！":rate>=60?"いい波きてる":"苦手は伸びしろ。もう1本！";
  render(`${header()}
  <div class="card result">
    <div class="big">${face}</div>
    <h2>${msg}</h2>
    <p>正答率 ${rate}%</p>
    <div class="score-row">
      <div><b style="color:var(--green)">${session.ok}</b><span>正解</span></div>
      <div><b style="color:var(--red)">${session.qs.length-session.ok}</b><span>ミス</span></div>

}

function pstat(id){ return (P.preps||{})[id] || {c:0,w:0}; }
function weakPreps(){ return PREPS.quiz.filter(it=>{const s=pstat(it.id); return s.w>0 && s.w>=s.c;}); }
function pickPrepQs(n){
  const bag = PREPS.quiz.map(it=>{const s=pstat(it.id); return {it, w: 1 + s.w*2 - Math.min(s.c,3)*0.3};});
  const out=[];
  while(out.length<n && bag.length){
    let tot=bag.reduce((a,b)=>a+Math.max(b.w,0.1),0), r=Math.random()*tot;
    for(let i=0;i<bag.length;i++){ r-=Math.max(bag[i].w,0.1); if(r<=0){out.push(bag[i].it); bag.splice(i,1); break;} }
  }
  return out;
}
function prepQuestion(it){
  return {type:"prep", key:it.id, prompt:it.q, label:"___ に入る前置詞は？", tag:"前置詞",
    choices:shuffle(it.choices.map(t=>({t, ok:t===it.a}))),
    answer:it.a, explain:it.exp, speakText:it.q.replace("___", it.a)};
}

function speak(text){

    speechSynthesis.speak(u);

function cleanTarget(t){
  return t.replace(/[~〜]/g," ").replace(/\(.*?\)/g," ").replace(/（.*?）/g," ").replace(/\s+/g," ").trim();
}

function listen(){
  if(rec){ try{rec.stop();}catch(e){} rec=null; return; }
  speechSynthesis.cancel();
  const r = new SR();
  r.lang = "en-US"; r.continuous = false; r.maxAlternatives = 5;
  r.interimResults = true; // iOS Safariはinterim無しだとonresultが来ないことがある
  const mic = $("#mic");
  mic.classList.add("listening");
  $("#hint").textContent = "マイク準備中…";
  let finals = [], interim = "", errored = false;
  r.onaudiostart = () => { $("#hint").textContent = "🎧 聞いてるよ！はっきり話してね（もう一度タップで停止）"; };
  r.onresult = e => {
    let fin = [], inter = "";
    for(const res of e.results){
      if(res.isFinal) fin.push(...[...res].map(a=>a.transcript));
      else inter += res[0].transcript;
    }
    if(fin.length) finals = fin;
    if(inter){ interim = inter; $("#hint").textContent = "👂 " + inter; }
  };
  r.onerror = e => {
    errored = true;
    const msgs = {
      "not-allowed": "マイクが許可されてない。アドレスバーの「ぁあ」→ Webサイトの設定 → マイクを許可",
      "service-not-allowed": "iPhoneの音声入力がオフかも。設定 → 一般 → キーボード →「音声入力」をON。LINEの中で開いてる場合はSafariで開き直してね",
      "audio-capture": "マイクが見つからない。他のアプリがマイクを使ってない？",
      "no-speech": "声が聞こえなかった。もう少し大きな声でもう一回！",
      "network": "ネットにつながってないみたい。電波をチェック！",
      "aborted": "止めたよ。もう一回タップでスタート"
    };
    $("#hint").textContent = (msgs[e.error] || "聞き取れなかった。もう一回タップ！") + " [" + e.error + "]";
    if(e.error!=="aborted" && ++srFails>=2) $("#pron-out").innerHTML = recModeBtnHtml();
  };
  const watchdog = setTimeout(()=>{ if(rec===r){ try{r.stop();}catch(e){} } }, 12000);
  r.onend = () => {
    clearTimeout(watchdog); mic.classList.remove("listening"); rec=null;
    const cands = finals.length ? finals : (interim ? [interim] : []);
    if(cands.length) pronResult(cands);
    else if(!errored){
      srFails++;
      $("#hint").textContent = "聞き取れなかった…もう一回タップ！（ダメな時は下の🛠へ）";
      if(srFails>=2) $("#pron-out").innerHTML = `<p class="note" style="text-align:center;margin-top:10px">この端末は音声認識が不調みたい。録音モードなら確実に練習できるよ↓</p>` + recModeBtnHtml();
    }
  };
  rec = r;
  try{ r.start(); }catch(e){ $("#hint").textContent = "開始できなかった。もう一回タップ！ [" + (e.name||"start-error") + "]"; }
}
async function micTest(){
  $("#hint").textContent = "🩺 マイク単体をテスト中…";
  try{
    const st = await navigator.mediaDevices.getUserMedia({audio:true});
    st.getTracks().forEach(t=>t.stop());
    $("#hint").textContent = "✅ マイク自体はOK！原因は認識サービス側。iOSを最新にして、もう一度🎤を試してみて";
  }catch(e){
    $("#hint").textContent = "❌ マイクが使えてない: " + e.name + "。設定 → アプリ → Safari → マイクを確認";
  }
}

/* --- 録音きき比べモード（音声認識が使えない端末の保険） --- */
let recMode = false, mediaRec = null, lastBlobUrl = null, srFails = 0;
function recModeBtnHtml(){ return `<button class="listen-btn" style="margin:10px auto 0" onclick="enableRecMode()">🎙 録音モードに切り替え</button>`; }
function enableRecMode(){ recMode = true; if(session && session.items) pronItem(); }
async function recToggle(){
  if(mediaRec && mediaRec.state === "recording"){ mediaRec.stop(); return; }
  speechSynthesis.cancel();
  try{
    const st = await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks = [];
    const mr = new MediaRecorder(st);
    mediaRec = mr;
    // 並行して音声認識も走らせる（動く端末なら自動判定がつく。ダメでも録音は生きる）
    let recAlts = [], rp = null;
    if(SR){
      try{
        rp = new SR(); rp.lang = "en-US"; rp.interimResults = true; rp.maxAlternatives = 5; rp.continuous = false;
        rp.onresult = e => {
          let fin = [], inter = "";
          for(const res of e.results){ if(res.isFinal) fin.push(...[...res].map(x=>x.transcript)); else inter += res[0].transcript; }
          if(fin.length) recAlts = fin; else if(inter) recAlts = [inter];
        };
        rp.onerror = () => { rp = null; };
        rp.start();
      }catch(e){ rp = null; }
    }
    $("#mic").classList.add("listening");
    $("#hint").textContent = "🔴 録音中…話し終わったらもう一度タップ";
    mr.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      st.getTracks().forEach(t=>t.stop());
      try{ if(rp) rp.stop(); }catch(e){}
      $("#mic").classList.remove("listening");
      mediaRec = null;
      if(!chunks.length){ $("#hint").textContent = "録音できてなかった。もう一回タップ！"; return; }
      if(lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
      lastBlobUrl = URL.createObjectURL(new Blob(chunks, {type: mr.mimeType || "audio/mp4"}));
      setTimeout(() => {  // 認識の最終結果をひと呼吸待つ
        let auto = "";
        if(recAlts.length){
          const j = judge(recAlts);
          session.scores[session.i] = Math.max(session.scores[session.i]||0, j.pct);
          bumpDay(); P.pron = (P.pron||0)+1; store.save(P);
          auto = j.html + `<div class="mic-hint" style="margin-top:6px">↓自分の耳でも聞き比べて、納得いく評価で確定しよう</div>`;
          $("#hint").textContent = "🤖 自動判定できた！";
        } else {
          $("#hint").textContent = "録音OK！お手本と聞き比べて自己採点しよう";
        }
        $("#pron-out").innerHTML = auto + `
        <div style="display:flex;gap:10px;justify-content:center;margin-top:12px">
          <button class="listen-btn" style="margin:0" onclick="speak(session.items[session.i].text)">🔊 お手本</button>
          <button class="listen-btn" style="margin:0" onclick="playBack()">▶️ 自分の声</button>
        </div>
        <div class="pills" style="justify-content:center;margin-top:12px">
          <button class="pill" onclick="selfGrade(100)">◎ 言えた</button>
          <button class="pill" onclick="selfGrade(70)">○ おしい</button>
          <button class="pill" onclick="selfGrade(30)">✕ もう一回</button>
        </div>`;
        playBack();
      }, 900);
    };
    mr.start();
    setTimeout(()=>{ if(mediaRec===mr && mr.state==="recording") mr.stop(); }, 8000);
  }catch(e){
    $("#hint").textContent = "❌ 録音できない: " + e.name + "。設定 → アプリ → Safari → マイクを確認";
  }
}
function playBack(){ if(lastBlobUrl){ new Audio(lastBlobUrl).play(); } }
function selfGrade(pct){
  bumpDay(); P.pron = (P.pron||0)+1; store.save(P);
  session.scores[session.i] = pct;
  pronNext();
}

function tokens(s){ return s.toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean); }
function matchScore(target, heard){
  const T=tokens(target), H=tokens(heard), n=T.length, m=H.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)
    dp[i][j] = T[i-1]===H[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
  const hit=new Array(n).fill(false);
  let i=n,j=m;
  while(i>0&&j>0){
    if(T[i-1]===H[j-1]){ hit[i-1]=true; i--; j--; }
    else if(dp[i-1][j]>=dp[i][j-1]) i--; else j--;
  }
  return {pct: n? Math.round(dp[n][m]/n*100):0, T, hit};
}
function judge(alts){
  const it = session.items[session.i];
  let best = null;
  for(const a of alts){ const s=matchScore(it.text,a); if(!best||s.pct>best.s.pct) best={a,s}; }
  const {a,s} = best;
  const wordsHtml = s.T.map((w,k)=>`<span class="${s.hit[k]?"hit":"miss"}">${esc(w)}</span>`).join(" ");
  return {pct:s.pct, html:`
    <div class="score-big">${s.pct>=80?"🎯":s.pct>=50?"👍":"🔁"} ${s.pct}%</div>
    <div class="heard">${wordsHtml}</div>
    <div class="mic-hint" style="margin-top:4px">聞き取り結果: “${esc(a)}”</div>`};
}
function pronResult(alts){
  const it = session.items[session.i];
  const j = judge(alts);
  bumpDay(); P.pron=(P.pron||0)+1; store.save(P);
  session.scores[session.i] = Math.max(session.scores[session.i]||0, j.pct);
  const good = j.pct>=80, mid = j.pct>=50;
  $("#pron-out").innerHTML = `${j.html}
    ${good?"":`<div class="explain" style="margin-top:10px">${mid?"おしい！":"もう一回！"}<b>赤い単語</b>が伝わらなかったところ。🔊お手本を聞いて、🎤でリトライできるよ。</div>`}
    <button class="next-btn" onclick="pronNext()">${session.i+1<session.items.length?"次へ →":"結果を見る"}</button>`;
  speak(good ? "Great job!" : "Listen and try again. " + it.text);
}
function pronNext(){
  session.i++;
  if(session.i < session.items.length) pronItem(); else pronDone();
}
function pronDone(){
  const avg = Math.round(session.scores.reduce((x,y)=>x+(y||0),0)/session.items.length);
  const face = avg>=90?"🏆":avg>=70?"🎉":"💪";
  render(`${header()}
  <div class="card result">
    <div class="big">${face}</div>
    <h2>発音トレ終了！</h2>
    <p>平均スコア ${avg}%</p>
    <div class="review-list">
      ${session.items.map((it,k)=>`<div class="item"><b>${esc(it.text)}</b> — ${session.scores[k]||0}%</div>`).join("")}
    </div>
    <button class="next-btn" onclick="startPron()">もう1セット</button>
    <button class="back-link" onclick="home()" style="margin:12px auto 0">ホームへ</button>
  </div>`);
}

/* --- きろく --- */
function stats(){
  const weak = VOCAB.filter(isWeak).sort((a,b)=>wstat(b.en).w-wstat(a.en).w).slice(0,15);
  const mastered = VOCAB.filter(isMastered).length;
  const acc = P.total? Math.round(P.correct/P.total*100) : 0;
  const wp = weakPreps();
  render(`${header()}
  <div class="card">
    <h3 class="sec">📈 きろく</h3>
    <div class="stat-grid">
      <div class="stat"><b>${P.total}</b><span>解いた問題</span></div>
      <div class="stat"><b>${acc}%</b><span>通算正答率</span></div>
      <div class="stat"><b>${mastered} <small style="font-size:12px;color:var(--sub)">/ ${VOCAB.length}</small></b><span>マスター済み単語</span></div>
      <div class="stat"><b>${streak()}日</b><span>連続トレーニング</span></div>
    </div>
  </div>
  <div class="card">
    <h3 class="sec">🔧 いまの苦手リスト</h3>
    ${weak.length? weak.map(v=>`<div class="weak-item"><b>${esc(v.en)}</b><span class="ja">${esc(v.ja)}</span></div>`).join("")
      : `<p class="note">まだ苦手データなし。問題を解くとここに「要復習の単語」が自動で並ぶ。</p>`}
    ${weak.length?`<button class="next-btn" onclick="vcfg.filter='weak';startVocab()">苦手だけ特訓する</button>`:""}
  </div>
  <div class="card">
    <h3 class="sec">🧭 前置詞の苦手</h3>
    ${wp.length? wp.map(it=>`<div class="weak-item"><b>${esc(it.q.replace("___","["+it.a+"]"))}</b></div>`).join("")
      : `<p class="note">前置詞クイズを解くと、まちがえた問題がここに並ぶ。</p>`}
    ${wp.length?`<button class="next-btn" onclick="startPrepQuiz()">前置詞を特訓する</button>`:""}
  </div>
  <div class="card">
    <h3 class="sec">🏄 きみの英語のあゆみ</h3>
    <p class="note" style="line-height:1.9">
      ${META.since}のスタートから <b style="color:var(--cyan)">${META.years}</b>・<b style="color:var(--cyan)">${META.lessons}回</b> の授業を継続中。<br>
      このアプリの${VOCAB.length}語は、ぜんぶ自分の授業に出てきた単語。<br>
      つまり全問「一度は出会ったことがある」——思い出せれば勝ち。
    </p>
  </div>
  <button class="back-link" onclick="home()">‹ もどる</button>`);
}

home();
</script>
